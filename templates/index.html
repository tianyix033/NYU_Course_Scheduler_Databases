{% extends "base.html" %}
{% block content %}
<article>
  {% if username %}
    <h1>hello {{ username }}</h1>
  {% else %}
    <h1>hello</h1>
    <p><a href="{{ url_for('auth.login') }}">Login</a> or <a href="{{ url_for('auth.register') }}">Register</a> to set your username.</p>
  {% endif %}
</article>
{% endblock %}
